name: Build and Release

# vから始まるGitタグがpushされたときに実行します。
on:
  push:
    tags:
      - "v*"

# GitHub Releaseの作成に必要です。
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Linux x64 applications
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 共通準備
      # ============================================================

      # Repositoryのソースコードを取得します。
      - name: Checkout repository
        uses: actions/checkout@v7

      # ビルド、テスト、publishに使用する.NET 10 SDKを準備します。
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # 使用する.NET SDKとRuntimeの情報を表示します。
      - name: Display .NET information
        run: dotnet --info

      # Gitタグの先頭にあるvを除去し、
      # debパッケージと.NETアプリのバージョンに使用します。
      #
      # 例:
      #   v0.1.0
      #     ↓
      #   0.1.0
      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Version: ${VERSION}"

      # debパッケージの作成に使用するツールをインストールします。
      - name: Install Debian package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # SBOM生成用のMicrosoft sbom-toolをインストールします。
      - name: Install SBOM tool
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool

      # SBOMからOSSライセンスNoticeを生成するためにONOTをインストールします。
      - name: Install ONOT
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/onot-venv"
          source "${RUNNER_TEMP}/onot-venv/bin/activate"

          pip install --upgrade pip
          pip install "onot[spdx,cyclonedx,excel,api]==1.1.2"

      # ============================================================
      # ソリューション全体のテスト
      # ============================================================

      # Repositoryルートにあるソリューションを復元します。
      - name: Restore solution
        run: dotnet restore

      # ソリューション全体をRelease構成でビルドします。
      - name: Build solution
        run: >
          dotnet build
          --configuration Release
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:SourceRevisionId=${{ github.sha }}
          -p:ContinuousIntegrationBuild=true

      # Unit Testを実行します。
      - name: Run tests
        run: >
          dotnet test
          --configuration Release
          --no-build
          --no-restore

      # ============================================================
      # LinuxEdgeInspection.Runtime
      # ============================================================

      # linux-x64向けpublishに必要な依存関係を復元します。
      - name: Restore camera runtime dependencies
        run: >
          dotnet restore
          src/LinuxEdgeInspection.Runtime/LinuxEdgeInspection.Runtime.csproj
          --runtime linux-x64

      # LinuxEdgeInspection.Runtimeをlinux-x64向けにpublishします。
      #
      # framework-dependent構成のため、実機には
      # .NET 10 Runtimeが必要です。
      - name: Publish camera runtime
        run: >
          dotnet publish
          src/LinuxEdgeInspection.Runtime/LinuxEdgeInspection.Runtime.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/linux-edge-inspection-runtime
          -p:Version=${{ env.VERSION }}
          -p:SourceRevisionId=${{ github.sha }}
          -p:ContinuousIntegrationBuild=true

      # 配布不要な開発用ファイルを削除します。
      - name: Clean camera runtime publish output
        shell: bash
        run: |
          rm -f \
            artifacts/publish/linux-edge-inspection-runtime/appsettings.Development.json

          find artifacts/publish/linux-edge-inspection-runtime \
            -maxdepth 1 \
            -type f \
            -name "*.pdb" \
            -delete

      # RuntimeのSBOM出力先を作成します。
      - name: Create camera runtime SBOM directory
        run: |
          mkdir -p artifacts/sbom/runtime

      # Runtimeのpublish成果物を基準にSBOMを生成します。
      - name: Generate camera runtime SBOM
        shell: bash
        run: |
          sbom-tool generate \
            -b "${GITHUB_WORKSPACE}/artifacts/publish/linux-edge-inspection-runtime" \
            -m "${GITHUB_WORKSPACE}/artifacts/sbom/runtime" \
            -pn "LinuxEdgeInspection.Runtime" \
            -pv "${VERSION}" \
            -ps "mono-tec"

      # RuntimeのSBOMからOSSライセンスNoticeを生成します。
      - name: Generate camera runtime OSS notice
        shell: bash
        run: |
          source "${RUNNER_TEMP}/onot-venv/bin/activate"

          rm -rf artifacts/license/linux-edge-inspection-runtime
          mkdir -p artifacts/license/linux-edge-inspection-runtime

          onot generate \
            -i artifacts/sbom/runtime/_manifest/spdx_2.2/manifest.spdx.json \
            -f markdown \
            --output-dir artifacts/license/linux-edge-inspection-runtime

      # Runtimeのライセンス関連ファイルを
      # Debianパッケージへ格納しやすい形へ整理します。
      - name: Prepare camera runtime compliance files
        shell: bash
        run: |
          COMPLIANCE_DIR="artifacts/compliance/linux-edge-inspection-runtime"

          rm -rf "${COMPLIANCE_DIR}"
          mkdir -p "${COMPLIANCE_DIR}"

          cp LICENSE "${COMPLIANCE_DIR}/LICENSE"

          NOTICE_FILE="$(find \
            artifacts/license/linux-edge-inspection-runtime \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | head -n 1)"

          if [[ -z "${NOTICE_FILE}" ]]; then
            echo "Runtime OSS Notice file was not generated."
            exit 1
          fi

          cp "${NOTICE_FILE}" "${COMPLIANCE_DIR}/THIRD-PARTY-NOTICES.md"

          cp \
            artifacts/sbom/runtime/_manifest/spdx_2.2/manifest.spdx.json \
            "${COMPLIANCE_DIR}/sbom.spdx.json"

          echo "Runtime compliance files:"
          find "${COMPLIANCE_DIR}" -maxdepth 1 -type f -print

      # publish成果物からRuntime用debパッケージを作成します。
      - name: Create camera runtime Debian package
        shell: bash
        run: |
          chmod +x packaging/runtime-deb/build-deb.sh

          PACKAGE_VERSION="${VERSION}" \
          PACKAGE_ARCHITECTURE="amd64" \
          RUNTIME_IDENTIFIER="linux-x64" \
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/linux-edge-inspection-runtime" \
          COMPLIANCE_DIR="${GITHUB_WORKSPACE}/artifacts/compliance/linux-edge-inspection-runtime" \
          ./packaging/runtime-deb/build-deb.sh

      # ============================================================
      # LinuxEdgeInspection.CaptureRequestListener
      # ============================================================

      # linux-x64向けpublishに必要な依存関係を復元します。
      - name: Restore Capture Request Listener dependencies
        run: >
          dotnet restore
          src/LinuxEdgeInspection.CaptureRequestListener/LinuxEdgeInspection.CaptureRequestListener.csproj
          --runtime linux-x64

      # LinuxEdgeInspection.CaptureRequestListenerを
      # linux-x64向けにpublishします。
      - name: Publish Capture Request Listener
        run: >
          dotnet publish
          src/LinuxEdgeInspection.CaptureRequestListener/LinuxEdgeInspection.CaptureRequestListener.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/linux-edge-inspection-capture-request-listener
          -p:Version=${{ env.VERSION }}
          -p:SourceRevisionId=${{ github.sha }}
          -p:ContinuousIntegrationBuild=true

      # 配布不要な開発用ファイルを削除します。
      - name: Clean Capture Request Listener publish output
        shell: bash
        run: |
          rm -f \
            artifacts/publish/linux-edge-inspection-capture-request-listener/appsettings.Development.json

          find artifacts/publish/linux-edge-inspection-capture-request-listener \
            -maxdepth 1 \
            -type f \
            -name "*.pdb" \
            -delete

      # Capture Request ListenerのSBOM出力先を作成します。
      - name: Create Capture Request Listener SBOM directory
        run: |
          mkdir -p artifacts/sbom/capture-request-listener

      # Capture Request Listenerのpublish成果物を基準にSBOMを生成します。
      - name: Generate Capture Request Listener SBOM
        shell: bash
        run: |
          sbom-tool generate \
            -b "${GITHUB_WORKSPACE}/artifacts/publish/linux-edge-inspection-capture-request-listener" \
            -m "${GITHUB_WORKSPACE}/artifacts/sbom/capture-request-listener" \
            -pn "LinuxEdgeInspection.CaptureRequestListener" \
            -pv "${VERSION}" \
            -ps "mono-tec"

      # Capture Request ListenerのSBOMからOSSライセンスNoticeを生成します。
      - name: Generate Capture Request Listener OSS notice
        shell: bash
        run: |
          source "${RUNNER_TEMP}/onot-venv/bin/activate"

          rm -rf artifacts/license/linux-edge-inspection-capture-request-listener
          mkdir -p artifacts/license/linux-edge-inspection-capture-request-listener

          onot generate \
            -i artifacts/sbom/capture-request-listener/_manifest/spdx_2.2/manifest.spdx.json \
            -f markdown \
            --output-dir artifacts/license/linux-edge-inspection-capture-request-listener

      # Capture Request Listenerのライセンス関連ファイルを
      # Debianパッケージへ格納しやすい形へ整理します。
      - name: Prepare Capture Request Listener compliance files
        shell: bash
        run: |
          COMPLIANCE_DIR="artifacts/compliance/linux-edge-inspection-capture-request-listener"

          rm -rf "${COMPLIANCE_DIR}"
          mkdir -p "${COMPLIANCE_DIR}"

          cp LICENSE "${COMPLIANCE_DIR}/LICENSE"

          NOTICE_FILE="$(find \
            artifacts/license/linux-edge-inspection-capture-request-listener \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | head -n 1)"

          if [[ -z "${NOTICE_FILE}" ]]; then
            echo "Capture Request Listener OSS Notice file was not generated."
            exit 1
          fi

          cp "${NOTICE_FILE}" "${COMPLIANCE_DIR}/THIRD-PARTY-NOTICES.md"

          cp \
            artifacts/sbom/capture-request-listener/_manifest/spdx_2.2/manifest.spdx.json \
            "${COMPLIANCE_DIR}/sbom.spdx.json"

          echo "Capture Request Listener compliance files:"
          find "${COMPLIANCE_DIR}" -maxdepth 1 -type f -print

      # publish成果物からCapture Request Listener用debパッケージを作成します。
      - name: Create Capture Request Listener Debian package
        shell: bash
        run: |
          chmod +x packaging/capture-request-listener-deb/build-deb.sh

          PACKAGE_VERSION="${VERSION}" \
          PACKAGE_ARCHITECTURE="amd64" \
          RUNTIME_IDENTIFIER="linux-x64" \
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/linux-edge-inspection-capture-request-listener" \
          COMPLIANCE_DIR="${GITHUB_WORKSPACE}/artifacts/compliance/linux-edge-inspection-capture-request-listener" \
          ./packaging/capture-request-listener-deb/build-deb.sh

      # ============================================================
      # 生成結果の確認
      # ============================================================

      # 作成されたdebパッケージを確認します。
      - name: Inspect generated Debian packages
        shell: bash
        run: |
          ls -la artifacts/packages

          dpkg-deb --info \
            "artifacts/packages/linux-edge-inspection-runtime_${VERSION}_amd64.deb"

          dpkg-deb --info \
            "artifacts/packages/linux-edge-inspection-capture-request-listener_${VERSION}_amd64.deb"

      # deb内部に意図したファイルが配置されていることを確認します。
      - name: Inspect Debian package contents
        shell: bash
        run: |
          dpkg-deb --contents \
            "artifacts/packages/linux-edge-inspection-runtime_${VERSION}_amd64.deb"

          dpkg-deb --contents \
            "artifacts/packages/linux-edge-inspection-capture-request-listener_${VERSION}_amd64.deb"

      # SBOM生成結果を確認します。
      - name: Inspect generated SBOMs
        shell: bash
        run: |
          find artifacts/sbom -type f -print

      # Compliance生成結果を確認します。
      - name: Inspect generated compliance files
        shell: bash
        run: |
          find artifacts/compliance -type f -print

      # Releaseへ添付するときに区別できるよう、
      # RuntimeとCapture Request ListenerのSBOMへ個別のファイル名を付けます。
      - name: Prepare SBOM release files
        shell: bash
        run: |
          cp \
            artifacts/sbom/runtime/_manifest/spdx_2.2/manifest.spdx.json \
            "artifacts/sbom/linux-edge-inspection-runtime_${VERSION}.spdx.json"

          cp \
            artifacts/sbom/capture-request-listener/_manifest/spdx_2.2/manifest.spdx.json \
            "artifacts/sbom/linux-edge-inspection-capture-request-listener_${VERSION}.spdx.json"

      # ============================================================
      # 成果物の登録
      # ============================================================

      # Actionsの実行結果からダウンロードできるように、
      # debとSBOMをWorkflow Artifactへ登録します。
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LinuxEdgeInspection-linux-x64
          path: |
            artifacts/packages/linux-edge-inspection-runtime_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-edge-inspection-capture-request-listener_${{ env.VERSION }}_amd64.deb
            artifacts/sbom/linux-edge-inspection-runtime_${{ env.VERSION }}.spdx.json
            artifacts/sbom/linux-edge-inspection-capture-request-listener_${{ env.VERSION }}.spdx.json
          if-no-files-found: error
          retention-days: 14

      # タグに対応するGitHub Releaseを作成し、
      # 2つのdebパッケージとSBOMを添付します。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/packages/linux-edge-inspection-runtime_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-edge-inspection-capture-request-listener_${{ env.VERSION }}_amd64.deb
            artifacts/sbom/linux-edge-inspection-runtime_${{ env.VERSION }}.spdx.json
            artifacts/sbom/linux-edge-inspection-capture-request-listener_${{ env.VERSION }}.spdx.json
          generate_release_notes: true